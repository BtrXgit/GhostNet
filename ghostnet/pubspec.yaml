name: ciphercloak
description: "CipherCloak VPN — Secure, fast, and anonymous OpenVPN client."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.3
  cupertino_icons: ^2.0.0
  http: ^1.6.0
  csv: ^5.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  rename: ^3.1.0
  google_fonts: ^9.0.0
  animate_do: ^5.1.0
  iconsax: ^0.0.8
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/vpn/
    - assets/images/
    - assets/flags/